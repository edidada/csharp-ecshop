name: .NET

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore csharp-ecshop.sln

      - name: Build
        run: dotnet build csharp-ecshop.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test csharp-ecshop.sln --configuration Release --no-build --verbosity normal
